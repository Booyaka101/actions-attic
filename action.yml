name: 'actions-attic'
description: 'Archive workflow runs, checks and statuses into your repo before GitHub deletes them from 2026-10-01, and keep the runs npm provenance points at.'
author: 'Booyaka101'
branding:
  icon: 'archive'
  color: 'orange'

inputs:
  token:
    description: 'Token used to read Actions data and write the archive branch.'
    required: false
    default: ${{ github.token }}
  ref:
    description: 'Git ref holding the archive. Default refs/attic/archive, which is not a branch.'
    required: false
    default: ''
  branch:
    description: 'Deprecated since 1.1.0. A branch name to write to instead of the default ref.'
    required: false
    default: ''
  mode:
    description: 'auto (top up then continue the backfill), backfill, incremental, preflight or provenance (report only).'
    required: false
    default: 'auto'
  retention-days:
    description: 'Preflight and provenance: retention window override instead of reading it from the API.'
    required: false
    default: ''
  fail-on-unarchived:
    description: 'Preflight and provenance: fail the step when at-risk records are not archived yet.'
    required: false
    default: 'false'
  package:
    description: 'Provenance only: the npm package whose published provenance names workflow runs.'
    required: false
    default: ''
  registry:
    description: 'Provenance only: npm registry to read from.'
    required: false
    default: 'https://registry.npmjs.org'
  probe-all:
    description: 'Provenance only: ask the attestations endpoint about every version, not only advertised ones.'
    required: false
    default: 'false'
  backfill-months:
    description: 'How many months of history to walk backwards.'
    required: false
    default: '14'
  max-requests:
    description: 'API request ceiling for one run. GITHUB_TOKEN allows 1000/hour/repo.'
    required: false
    default: '800'
  max-pages:
    description: 'Page ceiling for an incremental catch-up.'
    required: false
    default: '50'
  repository:
    description: 'Whose Actions history to read, owner/name. The branch is always written here.'
    required: false
    default: ''
  skip-checks:
    description: 'Skip check runs.'
    required: false
    default: 'false'
  skip-statuses:
    description: 'Skip commit statuses.'
    required: false
    default: 'false'

outputs:
  runs-added:
    description: 'Workflow run attempts added this run.'
  checks-added:
    description: 'Check runs added this run.'
  statuses-added:
    description: 'Commit statuses added this run.'
  committed:
    description: 'true when a commit was made.'
  commit-sha:
    description: 'SHA of the archive commit, empty when nothing changed.'
  backfill-frontier:
    description: 'First day of the oldest month archived so far, empty once the backfill is complete.'
  backfill-complete:
    description: 'true once the backfill has reached backfill-months.'
  requests-used:
    description: 'API requests spent this run.'
  ref:
    description: 'Ref that was written.'
  branch:
    description: 'Branch name when the ref is under refs/heads/, otherwise empty.'
  archive-url:
    description: 'Web URL for browsing the archive commit, empty when nothing was committed.'
  source-repository:
    description: 'Repository whose history was read.'
  retention-days:
    description: 'Preflight and provenance: the resolved retention window in days.'
  retention-source:
    description: 'Preflight and provenance: where the window came from (flag, api, or default).'
  unarchived-total:
    description: 'Preflight: at-risk records not yet in the archive. Provenance: referenced runs not archived and due for deletion.'
  preflight-json:
    description: 'Preflight only: the full preflight result as JSON.'
  provenance-json:
    description: 'Provenance only: the full provenance result as JSON.'

runs:
  using: 'node24'
  main: 'dist/index.cjs'
