name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  dist-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm run build
      - name: dist/ must match the committed bundle
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm pack
      - name: install the tarball into a clean directory and run it
        run: |
          mkdir -p "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/actions-attic-*.tgz
          ./node_modules/.bin/actions-attic --help
          ./node_modules/.bin/actions-attic --version
