# Copy this to .github/workflows/attic.yml in the repository you want to archive.
#
# The first run creates refs/attic/archive and starts walking history backwards.
# If it runs out of request budget it commits what it has and picks up where it
# left off the next night. Once history is captured each run takes seconds.

name: attic

on:
  schedule:
    # Nightly, off the hour so it does not collide with everyone else's cron.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  statuses: read
  contents: write

concurrency:
  # Two jobs writing the archive at once would race on the ref.
  group: actions-attic
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: Booyaka101/actions-attic@v1
        with:
          backfill-months: 14
          max-requests: 800
          # ref: refs/attic/archive   # the default; not a branch, so it stays
          #                           # out of the branch list and out of on:push
